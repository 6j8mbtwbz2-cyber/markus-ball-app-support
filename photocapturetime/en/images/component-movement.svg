<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 245" role="img" aria-labelledby="title desc"><title id="title">Moving name blocks</title><desc id="desc">Blocks are inserted into the active target name or returned to the tray.</desc><style>.bg{fill:#f6f7f9;stroke:#c8ccd2}.cap{font:700 14px system-ui;fill:#59636e}.t{font:600 16px system-ui;fill:#20262d}.box{fill:#e5e8ec;stroke:#aeb5bd}.date{fill:#dcecff;stroke:#4285c5}.time{fill:#eee2ff;stroke:#8757b8}.camera{fill:#ffe9d2;stroke:#c47724}.number{fill:#d8edff;stroke:#1475c9}.insert{fill:#e9f5ff;stroke:#1475c9;stroke-dasharray:5 4}.hint{font:14px system-ui;fill:#59636e}</style><rect class="bg" x="1" y="1" width="918" height="243" rx="14"/><text class="cap" x="28" y="35">ACTIVE TARGET NAME</text><g transform="translate(28 50)"><rect class="date" width="72" height="42" rx="7"/><text class="t" x="16" y="27">Date</text><rect class="box" x="78" width="34" height="42" rx="7"/><text class="t" x="90" y="27">_</text><rect class="time" x="118" width="72" height="42" rx="7"/><text class="t" x="132" y="27">Time</text><rect class="insert" x="196" width="112" height="42" rx="7"/><text class="t" x="209" y="27">Insert here</text><rect class="box" x="314" width="34" height="42" rx="7"/><text class="t" x="326" y="27">-</text><rect class="camera" x="354" width="86" height="42" rx="7"/><text class="t" x="367" y="27">Camera</text><rect class="box" x="446" width="34" height="42" rx="7"/><text class="t" x="458" y="27">_</text><rect class="number" x="486" width="132" height="42" rx="7"/><text class="t" x="498" y="27">Image Number</text></g><path d="M252 104v45m-7-8 7 8 7-8M252 149v-45" fill="none" stroke="#1475c9" stroke-width="2"/><text class="hint" x="278" y="132">Drag blocks between the target name and tray</text><rect class="box" x="28" y="169" width="864" height="52" rx="9"/><text class="t" x="47" y="201">Additions for Selected Files</text><rect class="box" x="690" y="177" width="65" height="36" rx="7"/><text class="t" x="706" y="201">HDR</text><rect class="box" x="765" y="177" width="105" height="36" rx="7"/><text class="t" x="779" y="201">ISO-HDR</text></svg>
